[package]
name = "hft-cli"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
hft-data = { version = "0.1.0", path = "../hft-data" }
hft-sim = { version = "0.1.0", path = "../hft-sim" }
hft-strategies = { version = "0.1.0", path = "../hft-strategies" }

[[bin]]
name = "hft"
path = "src/main.rs"
